[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cagentic"
dynamic = ["version"]
description = "A local-first personal AI assistant and coding agent for Ollama, OpenAI and Anthropic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cagentic" }]
keywords = ["ai", "assistant", "ollama", "llm", "cli", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "prompt_toolkit>=3.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "mypy>=1.10",
    "types-requests>=2.31",
]
performance = ["tiktoken>=0.7"]
# Syntax highlighting for fenced code blocks in the terminal. Optional on
# purpose: without it those blocks render exactly as they always did.
code = ["pygments>=2.17"]

[project.urls]
Homepage = "https://github.com/Darthness2/Cagentic"
Documentation = "https://github.com/Darthness2/Cagentic#readme"
Repository = "https://github.com/Darthness2/Cagentic"
Issues = "https://github.com/Darthness2/Cagentic/issues"

[project.scripts]
cagentic = "cagentic.cli:main"

# One source of truth for the version: cagentic/__init__.py. It was written
# out three times (here, there, and mcp_client's CLIENT_INFO), which is two
# too many to keep in step by hand.
[tool.setuptools.dynamic]
version = { attr = "cagentic.__version__" }

[tool.setuptools.packages.find]
include = ["cagentic*"]

[tool.setuptools.package-data]
cagentic = [
    "gateway_assets/*.html",
    "gateway_assets/*.css",
    "gateway_assets/*.js",
    "gateway_assets/*.svg",
    "gateway_assets/fonts/*.woff2",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Incremental baseline for compact legacy modules. Remove entries as files are
# touched; CI still catches undefined names, syntax issues and all new tests.
ignore = ["E402", "E501", "E701", "E702", "E741"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

    <rect x="162" y="495" width="74" height="74" rx="17" fill="#0A0C10"/><g color="#7CC4FF"><use href="#keystone" x="173" y="506" width="52" height="52"/></g>
    <rect x="288" y="495" width="74" height="74" rx="17" fill="#F2F2F2"/><g color="#242424"><use href="#keystone" x="299" y="506" width="52" height="52"/></g>
    <text class="label" x="73" y="603" text-anchor="middle" fill="#596675">STANDARD</text><text class="label" x="199" y="603" text-anchor="middle" fill="#596675">DARK</text><text class="label" x="325" y="603" text-anchor="middle" fill="#596675">TINTED</text>
  </g>

  <text class="caption" x="100" y="1010" fill="#596675">Preview uses the existing iOS palette: Standard #F7F9FB / #0969DA · Dark #0A0C10 / #7CC4FF · Tinted #F2F2F2 / #242424.</text>

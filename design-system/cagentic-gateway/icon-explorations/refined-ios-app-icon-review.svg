    <rect x="162" y="495" width="74" height="74" rx="17" fill="#0A0C10"/><g color="#7CC4FF"><use href="#relay" x="173" y="506" width="52" height="52"/></g>
    <rect x="288" y="495" width="74" height="74" rx="17" fill="#F2F2F2"/><g color="#242424"><use href="#relay" x="299" y="506" width="52" height="52"/></g>
    <text class="label" x="73" y="603" text-anchor="middle" fill="#596675">STANDARD</text><text class="label" x="199" y="603" text-anchor="middle" fill="#596675">DARK</text><text class="label" x="325" y="603" text-anchor="middle" fill="#596675">TINTED</text>
  </g>

  <g transform="translate(1000 310)">
    <rect width="400" height="640" rx="28" fill="#FFFFFF" stroke="#D0D7DE"/>
    <text class="name" x="36" y="55" fill="#111820">05 / Keystone</text>
    <text class="caption" x="36" y="86" fill="#596675">A composed frame around a live core.</text>
    <rect x="85" y="126" width="230" height="230" rx="53" fill="#F7F9FB"/>
    <g color="#0969DA"><use href="#keystone" x="120" y="161" width="160" height="160"/></g>
    <text class="caption" x="200" y="392" text-anchor="middle" fill="#111820">Cagentic</text>
    <rect x="36" y="430" width="328" height="1" fill="#D0D7DE"/>

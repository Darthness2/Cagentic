<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark light" />
<title>Cagentic browser bridge</title>
<link rel="stylesheet" href="theme.css" />
<style>
  html { background: var(--cag-bg); }
  body {
    width: 344px;
    max-height: 600px;
    margin: 0;
    overflow-y: auto;
    background: var(--cag-bg);
    color: var(--cag-text);
    font: 13px/1.5 var(--cag-font);
    -webkit-font-smoothing: antialiased;
  }
  header { padding: 16px 16px 12px; }

  .panel-btn {
    display: flex;
    width: calc(100% - 32px);
    min-height: 44px;
    margin: 0 16px 12px;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid transparent;
    border-radius: var(--cag-r-control);
    background: var(--cag-accent);
    color: var(--cag-on-accent);
    cursor: pointer;
    font-weight: 650;
    transition: opacity var(--cag-fast) var(--cag-ease);
  }
  .panel-btn:hover { opacity: .9; }
  .panel-btn svg,
  .button-icon {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .status-card {
    display: flex;
    min-height: 48px;
    margin: 0 16px;
    padding: 10px 12px;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--cag-border);
    border-radius: var(--cag-r-card);
    background: var(--cag-elev);
  }
  .dot {
    width: 9px;
    height: 9px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--cag-text-3);
  }
  .dot.on { background: var(--cag-ok); }
  .dot.off { background: var(--cag-error); }
  .status-text { font-weight: 600; }
  .status-sub {
    margin-left: auto;
    color: var(--cag-text-3);
    font-variant-numeric: tabular-nums;
  }

  .details { padding: 12px 16px 8px; }
  .details.hidden { display: none; }
  .kv {
    display: flex;
    min-height: 40px;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--cag-border);
  }
  .kv .k { color: var(--cag-text-3); }
  .kv .v {
    max-width: 210px;
    overflow: hidden;
    color: var(--cag-text-2);
    font-weight: 550;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kv .v.model { color: var(--cag-accent); }
  .activity { display: flex; align-items: center; gap: 7px; }
  .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--cag-warn);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  .section-label {
    margin: 16px 0 8px;
    color: var(--cag-text-2);
    font-size: 12px;
    font-weight: 600;
  }
  .recent,
  .sites { display: flex; flex-direction: column; gap: 6px; }
  .recent .empty,
  .sites .empty {
    padding: 4px 0;
    color: var(--cag-text-3);
    font-size: 12px;
  }
  .act,
  .site {
    display: flex;
    min-height: 36px;
    padding: 7px 9px;
    align-items: center;
    gap: 8px;
    border-radius: var(--cag-r-control);
    background: var(--cag-surface);
  }
  .act .mk,
  .site .mk { flex-shrink: 0; }
  .act.ok .mk,
  .site.allow .mk { color: var(--cag-ok); }
  .act.bad .mk,
  .site.deny .mk { color: var(--cag-error); }
  .act .name { color: var(--cag-text); font-weight: 600; }
  .act .sum {
    overflow: hidden;
    color: var(--cag-text-3);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .act .when {
    margin-left: auto;
    flex-shrink: 0;
    color: var(--cag-text-3);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .site .name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .site.deny .name { color: var(--cag-text-3); text-decoration: line-through; }
  .site-x {
    min-height: 30px;
    margin-left: auto;
    padding: 4px 8px;
    border: 0;
    border-radius: var(--cag-r-control);
    background: transparent;
    color: var(--cag-text-3);
    cursor: pointer;
  }
  .site-x:hover { background: var(--cag-surface-2); color: var(--cag-error); }
  .site-actions { display: flex; gap: 8px; margin-top: 8px; }
  .site-btn,
  .save-btn {
    min-height: 40px;
    border: 1px solid var(--cag-border);
    border-radius: var(--cag-r-control);
    background: var(--cag-elev);
    color: var(--cag-text-2);
    cursor: pointer;
    transition: border-color var(--cag-fast) var(--cag-ease),
                color var(--cag-fast) var(--cag-ease),
                background var(--cag-fast) var(--cag-ease);
  }
  .site-btn { flex: 1; padding: 7px 9px; }
  .site-btn:hover,
  .save-btn:hover {
    border-color: var(--cag-border-hover);
    background: var(--cag-accent-layer);
    color: var(--cag-accent);
  }
  .site-btn.danger:hover { border-color: var(--cag-error); color: var(--cag-error); }
  .site-btn:disabled,
  .save-btn:disabled,
  .panel-btn:disabled { opacity: .5; cursor: default; }

  footer {
    margin-top: 4px;
    padding: 14px 16px 16px;
    border-top: 1px solid var(--cag-border);
    background: var(--cag-stage);
  }
  footer label {
    display: block;
    margin-bottom: 6px;
    color: var(--cag-text-2);
    font-size: 12px;
    font-weight: 550;
  }
  footer label:not(:first-child) { margin-top: 12px; }
  .field-row { display: flex; gap: 8px; }
  input {
    width: 100%;
    min-width: 0;
    min-height: 40px;
    padding: 8px 10px;
    border: 1px solid var(--cag-border);
    border-radius: var(--cag-r-control);
    background: var(--cag-bg);
    color: var(--cag-text);
  }
  input:hover { border-color: var(--cag-border-hover); }
  input::placeholder { color: var(--cag-text-3); }
  .save-btn { padding: 7px 14px; }
  .ver {
    margin-top: 10px;
    color: var(--cag-text-3);
    font-size: 12px;
    line-height: 1.45;
  }
</style>
</head>
<body>
  <header>
    <div class="cag-brand">
      <span class="cag-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3c.7 5.1 3.9 8.3 9 9-5.1.7-8.3 3.9-9 9-.7-5.1-3.9-8.3-9-9 5.1-.7 8.3-3.9 9-9z"/></svg>
      </span>
      <span class="cag-brand-copy">
        <span class="cag-brand-name">Cagentic</span>
        <span class="cag-brand-subtitle">Browser companion</span>
      </span>
    </div>
  </header>

  <button id="openPanel" class="panel-btn">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v16H3zM15 4v16"/></svg>
    Open chat panel
  </button>

  <div class="status-card" role="status" aria-live="polite">
    <span class="dot" id="dot" aria-hidden="true"></span>
    <span class="status-text" id="statusText">Connecting…</span>
    <span class="status-sub" id="statusSub"></span>
  </div>

  <div class="details hidden" id="details">
    <div class="kv">
      <span class="k">Model</span>
      <span class="v model" id="vModel">&mdash;</span>
    </div>
    <div class="kv">
      <span class="k">Activity</span>
      <span class="v"><span class="activity" id="vActivity">&mdash;</span></span>
    </div>
    <div class="section-label">Site permissions</div>
    <div class="sites" id="sites"></div>
    <div class="site-actions">
      <button id="allowSite" class="site-btn">Allow this site</button>
      <button id="denySite" class="site-btn danger">Block this site</button>
    </div>
    <div class="section-label">Recent browser actions</div>
    <div class="recent" id="recent"></div>
  </div>

  <footer>
    <label for="token">Bridge token</label>
    <div class="field-row">
      <input id="token" type="password" placeholder="Paste token from Cagentic"
             autocomplete="off" spellcheck="false" />
    </div>
    <label for="port">Bridge port</label>
    <div class="field-row">
      <input id="port" type="number" value="8765" inputmode="numeric" />
      <button id="save" class="save-btn">Save</button>
    </div>
    <div class="ver" id="ver"></div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>

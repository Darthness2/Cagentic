<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>Cagentic</title>
<link rel="stylesheet" href="theme.css" />
<style>
  html,
  body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--cag-bg);
    color: var(--cag-text);
    font: 13px/1.5 var(--cag-font);
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex;
    min-height: 52px;
    padding: 8px 10px;
    flex-shrink: 0;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--cag-border);
    background: var(--cag-elev);
  }
  header .cag-brand-subtitle { display: none; }
  .spacer { flex: 1; }
  .ctx-btn,
  .retry {
    display: inline-flex;
    min-height: 36px;
    padding: 7px 10px;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid var(--cag-border);
    border-radius: var(--cag-r-control);
    background: var(--cag-surface);
    color: var(--cag-text-2);
    cursor: pointer;
    font-weight: 550;
    transition: border-color var(--cag-fast) var(--cag-ease),
                color var(--cag-fast) var(--cag-ease),
                background var(--cag-fast) var(--cag-ease);
  }
  .ctx-btn svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .ctx-btn:hover,
  .retry:hover {
    border-color: var(--cag-border-hover);
    background: var(--cag-accent-layer);
    color: var(--cag-accent);
  }
  .ctx-btn.done { border-color: var(--cag-ok); color: var(--cag-ok); }
  .ctx-btn:disabled { opacity: .45; cursor: default; }
  #frame { width: 100%; flex: 1; border: 0; display: none; background: var(--cag-bg); }
  .fallback {
    display: flex;
    flex: 1;
    padding: 32px 24px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    text-align: center;
  }
  .fallback .cag-mark { width: 40px; height: 40px; flex-basis: 40px; border-radius: var(--cag-r-card); }
  .fallback .cag-mark svg { width: 21px; height: 21px; }
  .fallback h1 { margin: 6px 0 0; font-size: 18px; font-weight: 650; line-height: 1.3; }
  .fallback p {
    max-width: 32ch;
    margin: 0;
    color: var(--cag-text-2);
    font-size: 13px;
    line-height: 1.6;
  }
  .fallback code {
    padding: 2px 6px;
    border: 1px solid var(--cag-border);
    border-radius: 6px;
    background: var(--cag-surface);
    color: var(--cag-text);
    font-family: var(--cag-code);
    font-size: 12px;
  }
  .retry {
    min-height: 40px;
    margin-top: 6px;
    padding-inline: 16px;
    border-color: transparent;
    background: var(--cag-accent);
    color: var(--cag-on-accent);
  }
  .retry:hover { border-color: transparent; background: var(--cag-accent); color: var(--cag-on-accent); opacity: .9; }
  @media (max-width: 360px) {
    header { padding-inline: 8px; }
    .ctx-btn { min-width: 40px; padding-inline: 8px; }
    .ctx-btn span { display: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="cag-brand">
      <span class="cag-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3c.7 5.1 3.9 8.3 9 9-5.1.7-8.3 3.9-9 9-.7-5.1-3.9-8.3-9-9 5.1-.7 8.3-3.9 9-9z"/></svg>
      </span>
      <span class="cag-brand-copy">
        <span class="cag-brand-name">Cagentic</span>
        <span class="cag-brand-subtitle">Local AI assistant</span>
      </span>
    </div>
    <span class="spacer"></span>
    <button id="ctxBtn" class="ctx-btn" title="Add this page's URL, title, and selected text to the chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6v18h12V7zM14 3v4h4M9 12h6M9 16h4"/></svg>
      <span>Add page</span>
    </button>
  </header>

  <iframe id="frame" title="Cagentic chat"></iframe>

  <div class="fallback" id="fallback">
    <span class="cag-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 3c.7 5.1 3.9 8.3 9 9-5.1.7-8.3 3.9-9 9-.7-5.1-3.9-8.3-9-9 5.1-.7 8.3-3.9 9-9z"/></svg>
    </span>
    <h1 id="fbTitle">Cagentic isn&rsquo;t running</h1>
    <p id="fbBody">Start it with <code>cagentic --serve</code>, then try again.</p>
    <button class="retry" id="retry">Try again</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>

name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff format --check cagentic tests
      - run: python -m ruff check cagentic tests
      - run: >-
          python -m mypy
          cagentic/storage.py cagentic/sessions.py cagentic/projects.py
          cagentic/reminders.py cagentic/workspaces.py cagentic/token_count.py
          cagentic/completion.py cagentic/diagnostics.py
      - run: python -m pytest -q

name: Cagentic

options:
  bundleIdPrefix: com.cagentic
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Cagentic:
    type: application
    platform: iOS
    sources:
      - path: Cagentic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cagentic.mobile
        PRODUCT_NAME: Cagentic
        INFOPLIST_FILE: Cagentic/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - CagenticTests
      gatherCoverageData: true

  CagenticTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CagenticTests
    dependencies:
      - target: Cagentic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cagentic.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cagentic.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Cagentic"
        BUNDLE_LOADER: "$(TEST_HOST)"

